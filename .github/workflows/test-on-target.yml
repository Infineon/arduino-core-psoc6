name: Test on-target

on:
  push:
    paths-ignore:
      - 'docs/**'

jobs:
  arduino-devops:
    uses: Infineon/arduino-devops/.github/workflows/test-on-target.yml@ottu-workflow
    with:
      runner-group: EPE_BLR
      plan: tests/plan.yml
      core-setup-script: bash ./tools/dev-setup.sh
      ci-setup-script: git submodule update --init extras/arduino-core-tests
    secrets: inherit
